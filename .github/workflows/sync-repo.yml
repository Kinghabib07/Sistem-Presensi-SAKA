name: Sync Repo to Deployment Target

on:
  push:
    branches:
      - main

jobs:
  sync:
    name: Sync Repository
    if: github.repository == 'Kinghabib07/Sistem-Presensi-SAKA'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Push to Deployment Repo (exclude .github folder)
        run: |
          # Buat direktori sementara dan salin kode tanpa folder .github
          git archive HEAD --worktree-attributes | tar -x --exclude='.github' -C /tmp/sync-target 2>/dev/null || (mkdir -p /tmp/sync-target && git archive HEAD | tar -x -C /tmp/sync-target && rm -rf /tmp/sync-target/.github)
          
          # Inisiasi git baru di direktori sementara
          cd /tmp/sync-target
          git init
          git config user.email "${{ github.event.head_commit.author.email || '41898282+github-actions[bot]@users.noreply.github.com' }}"
          git config user.name "${{ github.event.head_commit.author.name || 'github-actions[bot]' }}"
          git add .
          git commit -m "sync: from Kinghabib07/Sistem-Presensi-SAKA@${{ github.sha }}"
          
          # Push ke repo deployment
          git remote add target https://${{ secrets.TARGET_REPO_PAT }}@github.com/flownix-dev/Deployment-Sistem-Presensi-SAKA.git
          git push target HEAD:main --force
